<!DOCTYPE html>
<html lang="ko">
<head>

<body>
  <header>
    <h1>⭐ 오늘의 추천</h1>

  </header>

  <main>
    <div class="menu-card">
      <h2>🍵 말차 라떼</h2>
      <p class="price">5,500원</p>
      <p>진한 말차에 우유를 부드럽게 섞었습니다.</p>
      <p><strong>추천 이유:</strong> 쌀쌀한 날씨에 따뜻하게 마시기 좋고, 커피가 부담스러운 분께도 잘 맞습니다.</p>
    </div>

    <div class="menu-card">
      <h2>🥐 버터 크루아상</h2>
      <p class="price">3,800원</p>
      <p>아침마다 매장에서 직접 구운 겹겹이 바삭한 크루아상입니다.</p>
      <p><strong>추천 이유:</strong> 오늘 아침에 갓 구워 가장 맛있을 때이고, 말차 라떼와 함께 먹으면 잘 어울립니다.</p>
    </div>
  </main>
